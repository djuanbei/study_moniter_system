# 学习陪伴系统 - nginx reverse proxy (conf.d/upstream fragment)
#
# This file is loaded from /etc/nginx/conf.d/ which is included inside the
# http{} block of /etc/nginx/nginx.conf. It MUST NOT contain its own http{}
# wrapper. map + upstream directives are legal here.

map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
}

# Backend (uvicorn) — bound to loopback by scripts/deploy.sh.
# client_max_body_size on the server{} side matches configure.json:app.max_upload_mb.
upstream study_moniter_app {
    server 127.0.0.1:8000 max_fails=3 fail_timeout=30s;
    keepalive 16;
}