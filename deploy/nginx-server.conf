# 学习陪伴系统 - nginx server block (sites-enabled style)
#
# Installed by scripts/deploy.sh at /etc/nginx/sites-available/study-moniter
# and symlinked into sites-enabled/. Nginx's default http{} block includes
# both sites-enabled/* and conf.d/*, so the `map` + `upstream` from
# deploy/nginx-upstream.conf are in scope here.

server {
    listen 80 default_server;
    listen [::]:80 default_server;
    server_name _;

    # Uploads of student scans (PDF / multi-page images) can be tens of MB;
    # keep this in sync with configure.json:app.max_upload_mb.
    client_max_body_size 25m;
    client_body_timeout 120s;
    send_timeout 120s;

    # Security headers (browser-side hardening; backend is already strict).
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    location / {
        proxy_pass http://study_moniter_app;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade           $http_upgrade;
        proxy_set_header Connection        $connection_upgrade;
        proxy_read_timeout  300s;
        proxy_send_timeout  300s;
        proxy_buffering      off;     # SSE / streaming / long-LLM calls
        proxy_request_buffering off;
    }

    # Liveness probe (always 200 if nginx is up, regardless of backend).
    location = /nginx_healthz {
        access_log off;
        return 200 "ok\n";
    }
}