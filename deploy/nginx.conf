# 学习陪伴系统 - nginx reverse proxy
#
# Place this at /etc/nginx/sites-available/study-moniter and symlink into
# sites-enabled. uvicorn should bind to 127.0.0.1:8000 (or whichever port you
# chose). This config:
#
#   - Listens on :80 (plain HTTP). certbot --nginx will add the :443 listener
#     and a 301 redirect on top of this server block.
#   - Proxies all paths to the backend (the backend itself serves the
#     built frontend from frontend/dist).
#   - Allows large uploads (matches configure.json:app.max_upload_mb).
#   - Adds a few security headers; the SPA sets X-CSRF-Token itself.

# http -> https redirect is added by certbot; the plain-HTTP block is kept
# below so the site works on a fresh box without certbot.

map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
}

server {
    listen 80 default_server;
    listen [::]:80 default_server;
    server_name _;

    # Uploads of student scans (PDF / multi-page images) can be tens of MB;
    # keep this in sync with configure.json:app.max_upload_mb.
    client_max_body_size 25m;
    client_body_timeout 120s;
    send_timeout 120s;

    # Security headers (browser-side hardening; backend is already strict).
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    # Serve a friendly maintenance page if the backend is down.
    # (Nginx upstream health check via max_fails/fail_timeout.)
    upstream study_moniter_app {
        server 127.0.0.1:8000 max_fails=3 fail_timeout=30s;
        keepalive 16;
    }

    location / {
        proxy_pass http://study_moniter_app;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade           $http_upgrade;
        proxy_set_header Connection        $connection_upgrade;
        proxy_read_timeout  300s;
        proxy_send_timeout  300s;
        proxy_buffering      off;     # SSE / streaming / long-LLM calls
        proxy_request_buffering off;
    }

    # Health endpoint bypasses upstream check (always 200 if nginx is up).
    location = /nginx_healthz {
        access_log off;
        return 200 "ok\n";
    }
}